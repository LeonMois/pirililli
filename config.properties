# Pirililli configuration

# Web server: open http://<this-computer's-ip>:8080 on the iPad
server.port=8080

# Database (see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5433/pirililli
spring.datasource.username=pirililli
spring.datasource.password=pirililli

# Folder containing candidates.xlsx, questions.xlsx, translations.xlsx, voters.xlsx, pictures/ and sounds/
pirililli.data-dir=data

# How many 6-digit voter IDs should exist in voters.xlsx. Missing ones are generated on startup.
pirililli.voters-count=50

# Seconds the "thank you" screen is shown before returning to login
pirililli.thanks-seconds=10

# Language column (from questions.xlsx / translations.xlsx) used for everyone ...
pirililli.default-language=pt
# ... and the one used for voters marked as gringo in voters.xlsx
pirililli.gringo-language=en
