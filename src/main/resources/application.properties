# Built-in defaults. Override anything in ./config.properties (created on first start).
spring.config.import=optional:file:./config.properties
spring.main.banner-mode=off
vaadin.productionMode=true
vaadin.launch-browser=false
# Keep idle iPads connected for the whole party
server.servlet.session.timeout=24h
vaadin.heartbeatInterval=60
logging.level.org.atmosphere=warn
logging.level.org.apache.poi=error
